<!doctype html>
<html lang="zh-CN" class="brand-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1efe9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
    <script>
      // A document return lands at the project, without replaying the opening.
      if (new URLSearchParams(location.search).get('from') === 'workflow-docs' && location.hash === '#work-backend') {
        document.documentElement.dataset.projectReturn = 'workflow';
        document.documentElement.classList.remove('brand-loading');
      }
    </script>
    <style>
      html[data-project-return="workflow"] .brand-intro{display:none}
      html.brand-loading,html.brand-loading body{overflow:hidden}
      .brand-intro{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:#f1efe9;color:#14171c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .brand-intro-center{display:grid;justify-items:center;gap:22px}
      .brand-intro svg{display:block;width:clamp(112px,14vw,176px);height:auto;aspect-ratio:1}
      .brand-intro-name{font-size:12px;letter-spacing:.26em;padding-left:.26em}
      .brand-intro-status{position:absolute;bottom:max(38px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;color:#696a67;line-height:1.5;text-align:center}
      .brand-intro-skip{display:inline-flex;align-items:center;justify-content:center;gap:24px;min-height:46px;padding:11px 20px;border:1px solid #14171c35;border-radius:999px;background:transparent;color:#14171c;font:inherit;cursor:pointer;transition:background .2s,border-color .2s;animation:brand-action-enter .32s ease both}
      .brand-intro-skip:hover{background:#14171c08;border-color:#14171c70}
      .brand-intro-skip:disabled{cursor:default;opacity:.65}
      .brand-intro-skip[hidden]{display:none}
      .brand-intro-skip:focus-visible{outline:2px solid currentColor;outline-offset:5px}
      @keyframes brand-action-enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
      @media(prefers-color-scheme:dark){.brand-intro{background:#14171c;color:#fafbfc}.brand-intro-status{color:#a6a9ae}.brand-intro-skip{color:#fafbfc;border-color:#ffffff38}.brand-intro-skip:hover{background:#ffffff0c;border-color:#ffffff70}}
      @media(prefers-reduced-motion:reduce){.brand-intro-skip{animation:none;transition:none}}
    </style>
    <script src="/brand/motion-v13.js" defer></script>
    <script src="/brand/intro.js?v=slow-exit-1" defer></script>
    <link rel="preload" href="/media/think-different-poster.jpg" as="image" fetchpriority="high" />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/noto-sans-sc.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="我是 Arthur，2027 届软件工程本科生，主要做 Go 后端。这里记录 Agent Workflow、SurgeCart、Offer 捕手，以及实习、学习和代码之外的生活。" />
    <title>Arthur — Go Backend & Cloud Computing</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  </head>
  <body>
    <div id="brand-intro" class="brand-intro" role="status" aria-live="polite" aria-label="正在准备 Arthur 的个人网站">
      <div class="brand-intro-center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"  aria-hidden="true"><defs>
      <clipPath id="intro-mark-left"><path d="M0 0H256V180H106.5V256H0Z"/></clipPath>
      <clipPath id="intro-mark-spine"><path d="M0 0H256V295.8908L0 148.0892Z"/></clipPath>
      <clipPath id="intro-mark-right"><path d="M0 0H256V123.84L0 271.64Z"/></clipPath>
    </defs><g transform="translate(6 0)" fill="none" stroke="currentColor" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"><path d="M128 28 44 76.4974V173.4923L112.5622 213.077" clip-path="url(#intro-mark-left)"/><path d="M128 28 44 76.4974 128 124.9948V229" clip-path="url(#intro-mark-spine)"/><path d="M128 28 212 76.4974V157" clip-path="url(#intro-mark-right)"/></g></svg><span class="brand-intro-name">FRAMEWORK</span></div>
      <div class="brand-intro-status"><span id="brand-intro-status">正在准备画面</span><button class="brand-intro-skip" type="button" hidden>先进入网站 <span aria-hidden="true">↗</span></button></div>
    </div>
    <noscript><style>.brand-intro{display:none}html.brand-loading,html.brand-loading body{overflow:auto}</style>请启用 JavaScript 以浏览个人网站。</noscript>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

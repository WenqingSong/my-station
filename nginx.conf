server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Vite 构建产物带内容哈希，可长缓存 + immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余路径走 SPA 回退：客户端路由（如 /jobs）也能正确加载 index.html。
    # 本镜像只提供个人网站静态资源，不包含任何 Offer 捕手 Gateway 转发配置。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Portfolio responsive QA — local only</title>
<style>body{margin:0;background:#a9aaa5;display:grid;place-items:start center}iframe{border:0;background:#e9e9e5}label{font:14px system-ui;padding:8px}select{font:inherit;margin-left:12px}</style>
<label>Preview width<select aria-label="Preview width"><option>320</option><option>390</option><option>620</option><option>768</option><option>950</option><option>1000</option><option>1024</option><option>1440</option></select></label>
<iframe title="Responsive portfolio preview"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const frame = document.querySelector('iframe');
  frame.width = Math.max(320, Math.min(1920, Number(p.get('width')) || 390));
  frame.height = Math.max(600, Math.min(1200, Number(p.get('height')) || 844));
  frame.src = '/?' + (p.get('motion') === 'on' ? '' : 'hero-review=still') + (location.hash || '#work');
  const widthSelect = document.querySelector('select'); widthSelect.value = frame.width;
  widthSelect.addEventListener('change', () => { frame.width = widthSelect.value; });
</script></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arthur — local interruption checks</title></head>
<body><div id="root"></div><output id="detail-readout" hidden></output>
<script type="module">
// Development-only fault fixture, deliberately absent from Vite build inputs.
const params = new URLSearchParams(location.search);
if (params.get('fonts') === 'blocked') {
  const policy = document.createElement('meta'); policy.httpEquiv = 'Content-Security-Policy'; policy.content = "font-src 'none'"; document.head.append(policy);
}
if (params.get('clipboard') === 'pending') Object.defineProperty(navigator, 'clipboard', { configurable: true, value: { writeText: () => new Promise(() => {}) } });
if (params.get('motion') === 'reduce') {
  const nativeMatch = window.matchMedia.bind(window);
  window.matchMedia = query => query === '(prefers-reduced-motion: reduce)' ? { matches: true, media: query, onchange: null, addEventListener() {}, removeEventListener() {} } : nativeMatch(query);
}
await import('/src/main.tsx');
let injected = false;
const observe = new MutationObserver(() => {
  const img = document.querySelector('.portrait-window img');
  if (img && !injected && params.get('image') === 'error') {
    injected = true; img.closest('picture').querySelector('source').remove(); img.removeAttribute('srcset'); img.src = '/qa/intentionally-missing-portrait.webp';
  }
});
observe.observe(document.getElementById('root'), {childList: true, subtree: true});
const out = document.getElementById('detail-readout');
const measure = () => {
  out.textContent = JSON.stringify({width:innerWidth, height:innerHeight, overflow:document.documentElement.scrollWidth-innerWidth,
    hash:location.hash, focus:document.activeElement?.getAttribute('href') || document.activeElement?.tagName,
    locked:document.documentElement.classList.contains('intro-locked'), inert:document.querySelector('main')?.inert,
    portrait:document.querySelector('.portrait-frame')?.getAttribute('data-image-state'),
    hiddenCopy:[...document.querySelectorAll('.scene-copy,.case-notes,.about-narrative')].some(el => getComputedStyle(el).opacity==='0'),
    fonts:[...document.fonts].map(f=>({family:f.family,status:f.status}))});
};
setInterval(measure, 300);
</script></body></html>

$:
  vscode:
    - name: node-dev
      runner:
        cpus: 8
      services:
        - vscode
      docker:
        image: node:22
      stages:
        - name: install-dependencies
          script: npm ci
        - name: environment-check
          script: |
            node --version
            npm --version
            git --version

main:
  pull_request:
    - name: pr-check
      docker:
        image: node:22
        volumes:
          - /root/.npm
      stages:
        - name: install
          script: npm ci
        - name: build
          script: npm run build

  push:
    - name: main-ci
      services:
        - docker
      docker:
        image: node:22
        volumes:
          - /root/.npm
      stages:
        - name: install
          script: npm ci

        - name: build
          script: npm run build

        - name: docker build
          script: |
            set -e
            docker build \
              -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}" \
              -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest" \
              .

        - name: docker push
          script: |
            set -e
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}"
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"

        - name: sync-to-github-mirror
          # 只有原仓库（framework-station/my-station）才执行 GitHub 镜像同步。
          # fork 后 CNB_REPO_SLUG 会变成 fork 者的组织/仓库名，此步骤会自动跳过，
          # 也就不会去访问私有的密钥仓库，fork 用户的 CI 不受影响。
          if: |
            [ "${CNB_REPO_SLUG}" = "framework-station/my-station" ]
          imports:
            - https://cnb.cool/framework-station/my-station-password/-/blob/main/github-mirror.yml
          script: |
            set -eu

            printf 'machine github.com\nlogin %s\npassword %s\n' \
              "${GITHUB_USERNAME}" "${GITHUB_TOKEN}" > "${HOME}/.netrc"
            chmod 600 "${HOME}/.netrc"
            trap 'rm -f "${HOME}/.netrc"' EXIT

            git fetch origin \
              '+refs/heads/*:refs/remotes/cnb/*' \
              '+refs/tags/*:refs/tags/*' \
              --prune

            git remote remove github-mirror 2>/dev/null || true
            git remote add github-mirror \
              https://github.com/WenqingSong/my-station.git

            for ref in $(git for-each-ref \
              --format='%(refname)' refs/remotes/cnb); do
              branch="${ref#refs/remotes/cnb/}"
              if [ "${branch}" = "HEAD" ]; then
                continue
              fi
              echo "Syncing branch: ${branch}"
              git push github-mirror \
                "${ref}:refs/heads/${branch}"
            done

            echo "Syncing tags"
            git push github-mirror --tags
